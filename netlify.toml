# Headers and redirects live in _headers and _redirects (copied into dist/ by
# scripts/build-site.sh) so every deploy method applies them. The 2026-10-27
# hotfix REST zip deploy (6ae13448) applied only the two _redirects rules and
# none of the headers or redirects that used to live here.
[build]
  command = "bash scripts/build-site.sh"
  publish = "dist"
